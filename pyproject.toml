[project]
urls = { repository = "https://github.com/E-Sensia/echo-whisperX" }
authors = [{ name = "Max Bain" }]
name = "echo-whisperx"
version = "3.8.7"
description = "Time-Accurate Automatic Speech Recognition using Whisper."
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = { text = "BSD-2-Clause" }

dependencies = [
    "ctranslate2>=4.5.0",
    "faster-whisper>=1.2.0",
    "nltk>=3.9.4",
    "numpy>=2.1.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pyannote-audio>=4.0.0",
    "huggingface-hub<2.0",
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "torchcodec>=0.7,<1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or sys_platform == 'win32'",
    "transformers>=4.48.0",
    "triton>=3.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'" # only install triton on x86_64 Linux
]


[project.optional-dependencies]
dev = ["pytest"]
bench = ["jiwer"]

[project.scripts]
whisperx = "whisperx.__main__:cli"

[build-system]
requires = ["setuptools"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["whisperx*"]

# torchcodec (transitive dep of pyannote-audio >=4) has no wheels for Linux aarch64
[tool.uv]
override-dependencies = [
    "torchcodec>=0.7,<1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or sys_platform == 'win32'",
]

# NOTE: pas de [tool.uv.sources]/[[tool.uv.index]] torch ici.
# En tant que librairie consommée (echo-lib → EchoNet), echo-whisperx ne doit
# PAS imposer d'index PyTorch : uv propage ces index aux projets consommateurs
# et provoque un conflit avec leur propre index (ex. cu129). Les consommateurs
# choisissent leur build torch ; en standalone, configurer l'index via la CLI uv
# (--index https://download.pytorch.org/whl/cu1XX) ou un pip.conf.
